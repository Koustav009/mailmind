[project]
name = "email-ai-agent"
version = "0.1.0"
description = "Autonomous email triage agent: IMAP monitoring, multi-LLM classification, Telegram confirmations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "aioimaplib>=1.0.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-telegram-bot>=21.0",
    "apscheduler>=3.10,<4",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
